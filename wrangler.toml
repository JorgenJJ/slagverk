name = "slagverk"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Static assets (PWA-frontend). Erstatter Pages-modellen `pages_build_output_dir`.
# Filer i public/ serveres direkte; ukjente stier faller tilbake til index.html
# (SPA), og bindingen ASSETS lar Worker-en hente dem ved fallthrough.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1-database. Uendret fra Pages-versjonen.
[[d1_databases]]
binding = "DB"
database_name = "slagverk-db"
database_id = "1d541466-262e-4b69-a8bd-090649a78900"

# AI-assistent. Ikke-hemmelige variabler ligger her (versjonskontrollert).
# AI_API_KEY skal IKKE stå her – sett den som secret: `npx wrangler secret put AI_API_KEY`
# (i prod) og i .dev.vars (lokalt).
#
# Aktiv: Anthropic Claude Haiku. AI_API_KEY må være en Anthropic-nøkkel (sk-ant-…).
[vars]
AI_PROVIDER = "anthropic"
AI_MODEL    = "claude-haiku-4-5-20251001"

# For Google Gemini i stedet: kommenter ut de tre over, fjern kommentar her,
# og sett AI_API_KEY til en Google-nøkkel.
# [vars]
# AI_PROVIDER = "openai"
# AI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
# AI_MODEL    = "gemini-2.5-flash-lite"
